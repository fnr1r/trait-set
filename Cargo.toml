[package]
name = "trait-set"
version = "0.3.0"
authors = ["Igor Aleksanov <popzxc@yandex.ru>"]
edition = "2018"
repository = "https://github.com/popzxc/trait-set"
documentation = "https://docs.rs/trait-set"
readme = "README.md"
license = "MIT"
keywords = ["trait", "alias", "helpers", "utils"]
categories = ["rust-patterns"]
description = "Support for trait alias feature on stable Rust."

[lib]
proc-macro = true

[dependencies]
syn = "1.0"
quote = "1.0"
proc-macro2 = "=1.0.65"

[dev-dependencies]
trybuild = "=1.0.76"
# this is to prevent cargo update from updating to unsupported versions
once_cell = "=1.14.0"
serde = "=1.0.156"
serde_derive = "=1.0.156"
serde_json = "=1.0.99"
